@if (incidencia; as i) {
  <section class="card">
    <div class="top">
      <span class="codigo">{{ i.codigo }}</span>
      <div class="badges">
        <span [class]="'badge p-' + i.prioridad.toLowerCase()">{{ i.prioridad }}</span>
        <span [class]="'badge ' + claseEstado(i.estado)">{{ i.estado }}</span>
      </div>
    </div>

    <h1>{{ i.titulo }}</h1>

    <div class="block">
      <h4>Descripción técnica</h4>
      <p>{{ i.descripcion }}</p>
    </div>

    <div class="grid">
      <div class="block">
        <h4>Responsable</h4>
        <p>{{ i.responsable }}</p>
      </div>
      <div class="block">
        <h4>Fecha de registro</h4>
        <p>{{ i.fecha | date: 'dd/MM/yyyy' }}</p>
      </div>
    </div>

    <div class="actions">
      <a routerLink="/" class="btn ghost">← Volver</a>
      <a [routerLink]="['/editar', i.codigo]" class="btn primary">Editar</a>
    </div>
  </section>
}
